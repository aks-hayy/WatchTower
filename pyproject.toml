[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-engine"
version = "1.1.0"
description = "Identity-aware network forensic engine for real-time packet capture, behavioral anomaly detection, and automated identity attribution."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "aks-hayy", email = "AksAsh4@proton.me" }
]
requires-python = ">=3.9"
keywords = ["network", "forensics", "security", "pcap", "packet-capture", "threat-detection", "sigma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
tls = [
    "scapy[tls]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics"
Repository = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics"
"Bug Tracker" = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics/issues"

[project.scripts]
tower = "core.packet_engine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.ruff]
line-length = 120
target-version = "py39"
