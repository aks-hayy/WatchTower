[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-engine"
version = "1.0.0"
description = "Network forensics and traffic analysis platform with real-time capture, behavioral anomaly detection, identity attribution, and an interactive dashboard."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["network", "forensics", "security", "pcap", "packet-capture", "threat-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
tls = [
    "scapy[tls]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/AkshaySatasworkar/watchtower"
Repository = "https://github.com/AkshaSatworkar/watchtower"
"Bug Tracker" = "https://github.com/AkshaSatworkar/watchtower/issues"

[project.scripts]
tower = "core.packet_engine.main:main"

[tool.setuptools]
packages = ["core", "core.packet_engine", "core.forensics", "core.cli", "core.cli.modules", "core.ui", "core.storage"]

[tool.ruff]
line-length = 120
target-version = "py39"
