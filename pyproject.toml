[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-engine"
version = "2.0.0rc1"
description = "Identity-aware network forensic engine for real-time packet capture, behavioral anomaly detection, and automated identity attribution."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "WatchTower contributors" }
]
requires-python = ">=3.12,<3.14"
keywords = ["network", "forensics", "security", "pcap", "packet-capture", "threat-detection", "sigma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "cryptography>=41.0.0",
    "duckdb>=1.1.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pySigma>=1.3.0",
    "reportlab>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "keyring>=25.0.0",
    "argon2-cffi>=23.1.0",
    "webauthn>=2.0.0",
    "grpcio>=1.65.0",
    "protobuf>=5.27.0",
    "neo4j>=5.24.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
tls = [
    "scapy[tls]",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics"
Repository = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics"
"Bug Tracker" = "https://github.com/aks-hayy/WatchTower---Network-Monitoring-and-Forensics/issues"

[project.scripts]
tower = "core.packet_engine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
core = ["threat_intel.yaml"]
"core.detection" = ["*.yaml"]
"core.forensics.plugins.sigma" = ["*.yml", "*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# Sigma synchronization stores upstream repositories under data/.  They are
# rule content, not WatchTower test modules, and may contain duplicate test
# basenames across atomic checkouts.
testpaths = ["tests"]
