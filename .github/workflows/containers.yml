name: container-images

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/**"
      - "requirements/container.lock"
      - "core/**"
      - "rust/**"
      - "ui/**"
      - ".github/workflows/containers.yml"
  push:
    branches: [v2-rewrite]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create non-production Compose secrets
        run: |
          mkdir -p deploy/container/secrets
          openssl rand -base64 32 | tr -d '\n' > deploy/container/secrets/watchtower_master_key
          cat > deploy/container/.env.container <<'EOF'
          WATCHTOWER_MASTER_KEY_FILE=deploy/container/secrets/watchtower_master_key
          WATCHTOWER_UI_PORT=4173
          EOF
      - run: docker compose --env-file deploy/container/.env.container -f compose.yaml config --quiet

  build:
    needs: compose-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            file: Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/watchtower-controller
          - name: ui
            file: ui/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/watchtower-ui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
