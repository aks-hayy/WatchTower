schema_version: 1
matrix_seeds: 10
defaults:
  detector_id: watchtower.credential.ftp
  finding_type: credential.cleartext.ftp
  input_kind: stream
  modes: [isolation, integrated]
  backends: [python, rust]
cases:
  - id: ftp.positive.standard
    label: positive
    variant: positive
    recipe: &positive
      src: 10.250.0.10
      dst: 10.250.0.20
      sport: 50000
      dport: 21
      parts: ["USER analyst\r\n", "PASS WT_CALIBRATION_SECRET\r\n"]
      secret_values: [WT_CALIBRATION_SECRET]
  - id: ftp.positive.fragmented
    label: positive
    variant: fragmented
    recipe:
      <<: *positive
      parts: ["USER analyst\r\nPA", "SS WT_CALIBRATION_SECRET\r\n"]
  - id: ftp.positive.malformed-surrounding
    label: positive
    variant: malformed
    recipe:
      <<: *positive
      parts: ["garbage\u0000\nUSER analyst\n", "PASS WT_CALIBRATION_SECRET\n"]
  - id: ftp.positive.truncated-terminator
    label: positive
    variant: truncated
    recipe:
      <<: *positive
      parts: ["USER analyst\r\n", "PASS WT_CALIBRATION_SECRET"]
  - id: ftp.positive.retransmitted
    label: positive
    variant: retransmitted
    recipe:
      <<: *positive
      retransmit: true
  - id: ftp.positive.reordered
    label: positive
    variant: reordered
    recipe:
      <<: *positive
      reorder: true
  - id: ftp.positive.directional
    label: positive
    variant: directional
    recipe:
      <<: *positive
      direction: to_server
  - id: ftp.positive.reset
    label: positive
    variant: reset
    recipe: *positive
  - id: ftp.positive.memory-bound
    label: positive
    variant: memory_bound
    recipe:
      <<: *positive
      parts: ["NOOP\r\nNOOP\r\nUSER analyst\r\n", "PASS WT_CALIBRATION_SECRET\r\n"]
  - id: ftp.positive.nonstandard-port
    label: positive
    variant: nonstandard_port
    recipe:
      <<: *positive
      dport: 2121
  - id: ftp.benign.integrated
    label: benign
    variant: benign
    recipe:
      src: 10.250.0.30
      dst: 10.250.0.40
      sport: 51000
      dport: 21
      parts: ["USER anonymous\r\n", "SYST\r\n", "QUIT\r\n"]
  - id: ftp.benign.bulk
    repeat: 29
    label: benign
    variant: benign
    modes: [isolation]
    unsupported:
      integrated: Bulk benign repetitions use the representative integrated case above.
    recipe:
      src: 10.250.0.31
      dst: 10.250.0.40
      sport: 52000
      dport: 21
      parts: ["USER anonymous\r\n", "TYPE I\r\n", "QUIT\r\n"]
