schema_version: 1
matrix_seeds: 10
defaults:
  detector_id: watchtower.stateful.host
  input_kind: session
  modes: [isolation, integrated]
  backends: [python, rust]
cases:
  - id: stateful.vertical.positive
    finding_type: recon.port_scan
    label: positive
    variant: positive
    recipe: &stateful_vertical
      flows:
        - repeat: 20
          src: 10.250.60.10
          dst: 10.250.60.20
          sport: 58000
          dport: "{n}"
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 0
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: false
  - id: stateful.vertical.positive.matrix
    finding_type: recon.port_scan
    label: positive
    variants: [malformed, truncated, fragmented, retransmitted, reordered, directional, reset, memory_bound, positive_extra]
    modes: [isolation]
    unsupported:
      integrated: Representative positive production replay is covered above.
    recipe: *stateful_vertical
  - id: stateful.vertical.benign.integrated
    finding_type: recon.port_scan
    label: benign
    variant: benign
    recipe:
      <<: *stateful_vertical
      flows:
        - repeat: 19
          src: 10.250.60.10
          dst: 10.250.60.20
          sport: 58000
          dport: "{n}"
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 1
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: true
  - id: stateful.vertical.benign.bulk
    finding_type: recon.port_scan
    repeat: 29
    label: benign
    variant: benign
    modes: [isolation]
    unsupported:
      integrated: Bulk benign repetitions use the representative integrated case above.
    recipe:
      <<: *stateful_vertical
      flows:
        - repeat: 19
          src: 10.250.60.10
          dst: 10.250.60.20
          sport: 58000
          dport: "{n}"
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 1
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: true

  - id: stateful.horizontal.positive
    finding_type: recon.host_scan
    label: positive
    variant: positive
    recipe: &stateful_horizontal
      flows:
        - repeat: 20
          src: 10.250.61.10
          dst: "10.250.61.{n}"
          sport: 58100
          dport: 445
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 0
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: false
  - id: stateful.horizontal.positive.matrix
    finding_type: recon.host_scan
    label: positive
    variants: [malformed, truncated, fragmented, retransmitted, reordered, directional, reset, memory_bound, positive_extra]
