    unsupported:
      integrated: Representative positive production replay is covered above.
    recipe: *stateful_horizontal
  - id: stateful.horizontal.benign.integrated
    finding_type: recon.host_scan
    label: benign
    variant: benign
    recipe:
      <<: *stateful_horizontal
      flows:
        - repeat: 19
          src: 10.250.61.10
          dst: "10.250.61.{n}"
          sport: 58100
          dport: 445
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 1
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: true
  - id: stateful.horizontal.benign.bulk
    finding_type: recon.host_scan
    repeat: 29
    label: benign
    variant: benign
    modes: [isolation]
    unsupported:
      integrated: Bulk benign repetitions use the representative integrated case above.
    recipe:
      <<: *stateful_horizontal
      flows:
        - repeat: 19
          src: 10.250.61.10
          dst: "10.250.61.{n}"
          sport: 58100
          dport: 445
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 1
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: true

  - id: stateful.synflood.positive
    finding_type: recon.syn_flood
    input_kind: flow
    label: positive
    variant: positive
    recipe: &stateful_syn_flood
      src: 10.250.62.10
      dst: 10.250.62.20
      sport: 58200
      dport: 443
      protocol: TCP
      tcp_syn_count: 4000
      tcp_syn_ack_count: 0
      start_time: 1
      last_seen: 5
      l7_metadata:
        conversation_syn_count: 4000
        conversation_syn_ack_count: 0
  - id: stateful.synflood.positive.matrix
    finding_type: recon.syn_flood
    input_kind: flow
    label: positive
    variants: [malformed, truncated, fragmented, retransmitted, reordered, directional, reset, memory_bound, positive_extra]
    modes: [isolation]
    unsupported:
      integrated: Representative positive production replay is covered above.
    recipe: *stateful_syn_flood
  - id: stateful.synflood.benign.integrated
    finding_type: recon.syn_flood
    input_kind: flow
    label: benign
    variant: benign
    recipe:
      <<: *stateful_syn_flood
      tcp_syn_count: 100
      tcp_syn_ack_count: 90
      l7_metadata:
        conversation_syn_count: 100
        conversation_syn_ack_count: 90
  - id: stateful.synflood.benign.bulk
    finding_type: recon.syn_flood
    input_kind: flow
