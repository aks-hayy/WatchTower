    recipe:
      <<: *stateful_syn_flood
      tcp_syn_count: 100
      tcp_syn_ack_count: 90
      l7_metadata:
        conversation_syn_count: 100
        conversation_syn_ack_count: 90

  - id: stateful.lateral.positive
    finding_type: lateral.admin_fanout
    label: positive
    variant: positive
    recipe: &stateful_lateral
      flows:
        - repeat: 5
          src: 10.250.63.10
          dst: "10.250.63.{n}"
          sport: 58300
          dport: 445
          protocol: TCP
          tcp_syn_count: 1
          tcp_syn_ack_count: 0
          start_time: "{n}"
          last_seen: "{n}"
          l7_metadata:
            conversation_established: false
            peer_novelty: true
            auth_failure: true
  - id: stateful.lateral.positive.matrix
    finding_type: lateral.admin_fanout
    label: positive
    variants: [malformed, truncated, fragmented, retransmitted, reordered, directional, reset, memory_bound, positive_extra]
